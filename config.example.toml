# HGT Bookkeeper Configuration Template
# Copy this file to config.toml and edit with your actual GnuCash account names
#
# Accounting Flow:
# 1. On charge: Record revenue (gross), fees (expense), net to Stripe Balance
# 2. On stripe_fee: Reduce Stripe Balance, record billing expense
# 3. On payout: Move from Stripe Balance to Checking:Operating
# 4. Run `book tax` monthly/quarterly to:
#    - Calculate tax liability on net profit
#    - Move cash from Operating to withholding sub-accounts
#    - Create liability entries balanced by equity reserve
# 5. Owner's draw taken manually from Operating
# 6. Quarterly tax payments clear liabilities from withholding accounts
#
# Export Format: GnuCash

[accounts.gnucash]
# Income accounts
subscription_income = "Income:Business:Subscription Revenue"
invoice_income = "Income:Business:Invoice Revenue"

# Asset accounts
checking = "Assets:Current Assets:Checking Account"
stripe_balance = "Assets:Current Assets:Stripe Balance"
operating = "Assets:Current Assets:Checking Account:Operating"
withholding_fica = "Assets:Current Assets:Checking Account:Withholding:FICA"
withholding_federal = "Assets:Current Assets:Checking Account:Withholding:Federal"
withholding_state = "Assets:Current Assets:Checking Account:Withholding:State"

# Expense accounts
transaction_fees = "Expenses:Payment Processing Fees:Transaction Fees"
billing_fees = "Expenses:Payment Processing Fees:Billing Fees"

# Liability accounts
tax_liability_fica = "Liabilities:Taxes Payable:FICA"
tax_liability_federal = "Liabilities:Taxes Payable:Federal Income Tax"
tax_liability_state = "Liabilities:Taxes Payable:State Income Tax"

# Equity accounts
owner_draw = "Equity:Owner Draw"
owner_tax_reserve = "Equity:Owner Tax Reserve"

[tax_rates]
# FICA (Self-Employment Tax):
# - 15.3% total (12.4% Social Security + 2.9% Medicare)
# - Applied to 92.35% of net profit
fica = 0.153
fica_taxable_percent = 0.9235

# Income Tax:
# - Adjust rates to match your tax bracket
# - Applied to net profit minus (FICA * 50%) deduction
federal_income = 0.12
state_income = 0.0575

[options]
# Round all monetary amounts to 2 decimal places
round_to_cents = true

